name: Qodana
on:
  workflow_dispatch:
  pull_request:
    branches: [main, qa, develop]
  push:
    branches: [main, qa, develop]

jobs:
  qodana:
    runs-on: ubuntu-latest
    # qodana-js (a diferencia de qodana-jvm-community) necesita un QODANA_TOKEN
    # gratuito de qodana.cloud; sin el, se salta el job en vez de fallar el PR.
    if: ${{ vars.QODANA_ENABLED == 'true' }}
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2025.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          pr-mode: true
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: false
          push-fixes: "none"
