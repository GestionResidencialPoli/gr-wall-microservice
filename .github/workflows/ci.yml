name: CI

on:
  push:
    branches: [main, qa, develop]
  pull_request:
    branches: [main, qa, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen de runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: gr-wall-microservice:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir imagen de migraciones
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: false
          load: true
          tags: gr-wall-microservice:ci-migrate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Levantar Postgres y Redis para la prueba
        run: |
          docker run -d --name postgres-smoke \
            -e POSTGRES_DB=gr_wall_db -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 postgres:16-alpine
          docker run -d --name redis-smoke -p 6379:6379 redis:7-alpine
          for i in $(seq 1 30); do
            docker exec postgres-smoke pg_isready -U postgres && break
            sleep 1
          done

      - name: Correr migraciones
        run: |
          docker run --rm --network host \
            -e DB_HOST=localhost -e DB_PORT=5432 -e DB_USERNAME=postgres -e DB_PASSWORD=postgres -e DB_NAME=gr_wall_db \
            gr-wall-microservice:ci-migrate

      - name: Arrancar el contenedor y validar /health
        run: |
          docker run -d --name app-smoke \
            --network host \
            -e DB_HOST=localhost -e DB_PORT=5432 -e DB_USERNAME=postgres -e DB_PASSWORD=postgres -e DB_NAME=gr_wall_db \
            -e REDIS_URL=redis://localhost:6379 \
            -e JWT_SECRET=ci-secreto-de-al-menos-32-caracteres-para-pruebas \
            -e INTERNAL_SERVICE_TOKEN=ci-secreto-de-al-menos-32-caracteres-para-pruebas \
            -e USER_SERVICE_URL=http://localhost:8080 \
            gr-wall-microservice:ci

          for i in $(seq 1 15); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4100/health || true)
            if [ "$status" = "200" ]; then
              echo "Servicio saludable"
              exit 0
            fi
            sleep 2
          done

          echo "El servicio no llego a estar saludable a tiempo"
          docker logs app-smoke
          exit 1

      - name: Logs (si algo fallo)
        if: failure()
        run: docker logs app-smoke || true
